<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BioPrint | Secure Authentication</title>
  <style>
    /* Modern Reset & Base Styles */
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body {
      background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
      color: #e0e0e0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    /* Glassmorphism Card */
    .card {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 2.5rem;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
    }

    .header { text-align: center; margin-bottom: 2rem; }
    .header h2 { color: #00e676; font-weight: 600; letter-spacing: 1px; }
    .header p { color: #aaa; font-size: 0.9rem; margin-top: 5px; }

    /* Tab Toggle */
    .tabs { display: flex; background: rgba(0,0,0,0.2); border-radius: 8px; margin-bottom: 1.5rem; overflow: hidden; }
    .tab {
      flex: 1; text-align: center; padding: 10px; cursor: pointer;
      font-size: 0.9rem; font-weight: bold; color: #888; transition: 0.3s;
    }
    .tab.active { background: #00e676; color: #121212; }

    /* Form Inputs */
    .input-group { margin-bottom: 1.2rem; }
    .input-group label { display: block; font-size: 0.85rem; color: #bbb; margin-bottom: 5px; }
    .input-group input {
      width: 100%; padding: 12px; border-radius: 8px;
      background: rgba(0, 0, 0, 0.2); border: 1px solid rgba(255, 255, 255, 0.1);
      color: #fff; font-size: 1rem; transition: border 0.3s, box-shadow 0.3s;
    }
    .input-group input:focus {
      outline: none; border-color: #00e676;
      box-shadow: 0 0 8px rgba(0, 230, 118, 0.2);
    }

    /* Submit Button */
    button[type="submit"] {
      width: 100%; padding: 12px; border-radius: 8px; border: none;
      background: #00e676; color: #121212; font-size: 1rem; font-weight: bold;
      cursor: pointer; transition: 0.3s; margin-top: 1rem;
    }
    button[type="submit"]:hover { background: #00c853; }
    button[type="submit"]:disabled { background: #555; cursor: not-allowed; color: #888; }

    /* Status Notifications */
    #status {
      margin-top: 1.5rem; padding: 12px; border-radius: 8px;
      text-align: center; font-size: 0.9rem; font-weight: bold;
      opacity: 0; transform: translateY(-10px); transition: all 0.3s ease;
      display: none;
    }
    #status.show { opacity: 1; transform: translateY(0); display: block; }
    
    .status-granted { background: rgba(0, 230, 118, 0.15); border: 1px solid #00e676; color: #69f0ae; }
    .status-blocked { background: rgba(244, 67, 54, 0.15); border: 1px solid #f44336; color: #ff8a80; }
    .status-info { background: rgba(33, 150, 243, 0.15); border: 1px solid #2196f3; color: #81d4fa; }
  </style>
</head>
<body>

<div class="card">
  <div class="header">
    <h2>BioPrint Telemetry</h2>
    <p>Behavioral Keystroke Authentication</p>
  </div>
  
  <div class="tabs">
    <div class="tab active" data-mode="enroll" id="tabEnroll">Enroll</div>
    <div class="tab" data-mode="verify" id="tabVerify">Sign In</div>
  </div>

  <form id="bioprintForm">
    <div class="input-group">
      <label for="username">Username</label>
      <input type="text" id="username" placeholder="e.g., user123" autocomplete="off" required>
    </div>

    <div class="input-group">
      <label for="password">Password</label>
      <input type="password" id="password" placeholder="Type naturally..." autocomplete="off" required>
    </div>

    <button type="submit" id="submitBtn">Submit Telemetry</button>
  </form>

  <div id="status"></div>
</div>

<script>
  // State variables
  let currentMode = 'enroll';
  let keystrokes = [];
  let activeKeys = {};

  // DOM Elements
  const form = document.getElementById('bioprintForm');
  const passwordInput = document.getElementById('password');
  const submitBtn = document.getElementById('submitBtn');
  const statusDiv = document.getElementById('status');
  const tabs = document.querySelectorAll('.tab');

  // Tab Toggle Logic
  tabs.forEach(tab => {
    tab.addEventListener('click', (e) => {
      tabs.forEach(t => t.classList.remove('active'));
      e.target.classList.add('active');
      currentMode = e.target.getAttribute('data-mode');
      
      // Reset state on tab switch
      passwordInput.value = '';
      statusDiv.classList.remove('show');
      keystrokes = [];
      activeKeys = {};
      
      submitBtn.textContent = currentMode === 'enroll' ? 'Submit Enrollment' : 'Verify Identity';
    });
  });

  // Keystroke Telemetry Collection
  passwordInput.addEventListener('keydown', (e) => {
    // FIX: Ignore auto-repeated keys when a user holds a key down
    if (e.repeat) return; 
    
    if (!activeKeys[e.code]) {
      activeKeys[e.code] = performance.now();
    }
  });

  passwordInput.addEventListener('keyup', (e) => {
    if (activeKeys[e.code]) {
      const pressTime = activeKeys[e.code];
      const releaseTime = performance.now();
      keystrokes.push({
        key: e.key,
        pressTime: pressTime,
        releaseTime: releaseTime
      });
      delete activeKeys[e.code];
    }
  });

  // Reset telemetry if user clicks away and clicks back to re-type
  passwordInput.addEventListener('focus', () => {
    if (passwordInput.value === '') {
      keystrokes = [];
      activeKeys = {};
    }
  });

  // Form Submission
  form.addEventListener('submit', async (e) => {
    e.preventDefault(); // Prevents page reload
    
    const username = document.getElementById('username').value.trim();
    const password = passwordInput.value;

    if (keystrokes.length === 0) {
      showStatus('No typing telemetry detected. Please type the password manually.', 'status-blocked');
      return;
    }

    submitBtn.disabled = true;
    submitBtn.textContent = 'Processing...';
    showStatus('Analyzing typing rhythm...', 'status-info');

    try {
      const response = await fetch('http://127.0.0.1:8000/api/bioprint/telemetry', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          username,
          password,
          mode: currentMode,
          keystrokes
        })
      });

      const result = await response.json();

      if (!response.ok) throw new Error(result.detail || 'Backend connection failed');

      if (result.status === 'granted') {
        showStatus(`${result.message} (Score: ${result.score}%)`, 'status-granted');
      } else if (result.status === 'blocked') {
        showStatus(`${result.message}: ${result.reason}`, 'status-blocked');
      } else {
        showStatus(result.message, 'status-info');
        if (currentMode === 'enroll') passwordInput.value = ''; // Auto-clear for next sample
      }
    } catch (err) {
      showStatus(`Error: Is the FastAPI server running? (${err.message})`, 'status-blocked');
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = currentMode === 'enroll' ? 'Submit Enrollment' : 'Verify Identity';
      keystrokes = [];
      activeKeys = {};
    }
  });

  function showStatus(msg, className) {
    statusDiv.className = `show ${className}`;
    statusDiv.textContent = msg;
  }
</script>
</body>
</html>
